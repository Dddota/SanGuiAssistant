name: Test Split Upload to Gitee

# 一次性验证：GitHub 海外 runner 把分卷后的 zip 分片直传 Gitee 能否穿过跨境链路。
# 触发：仅手动（workflow_dispatch），不使用任何 tag/分支触发，与 build.yml / release.yml 互不干扰。
# 作用：直接证明 publish_release.py 的 _split_parts 分卷，能否绕开此前的
#       "整包上传到 Gitee 在 ssl.sendall 处 Write timed out" 问题。
#       若本 workflow 上传成功（拿到分片 URL）→ 分片可跨境，GitHub 这半边也能全自动传 Gitee；
#       若在分片上传处同样超时/失败 → 坐实跨境连接层被墙，维持"本地手动传 Gitee"方案。
# 验证完即可删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build package
        shell: pwsh
        env:
          PYTHON: "python"
        run: |
          .\build_release.ps1

      - name: Show built zip
        shell: pwsh
        run: |
          Get-ChildItem dist\*.zip | ForEach-Object { "zip: $($_.Name) $($_.Length) bytes" }

      - name: Split & upload to Gitee
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: test-split-upload
        run: |
          # zip 名由 __version__ 决定（如 SanguiHelper-v1.0.3.zip），与 --tag 无关。
          # 显式用 --zip 指向实际构建产物，避免 publish_release 按 tag 猜文件名找不到。
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          Write-Host "uploading from: $zip"
          python scripts/publish_release.py "--token=$env:GITEE_TOKEN" "--tag=$env:TAG" "--zip=$zip" --body "跨境分片直传验证" --prerelease